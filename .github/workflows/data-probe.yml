name: Data sources probe
# Temporary: checks public sources (format, licence, reachability) from CI.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Xceed · legal links and terms text
        continue-on-error: true
        run: |
          UA="OrivexyNightsBot/1.0 (+https://github.com/Orivexy/ORIVEXY-Nights)"
          curl -sL --max-time 30 -A "$UA" https://xceed.me/es/barcelona/events -o home.html
          grep -oiE 'href="[^"]*(legal|terms|condicion|conditions|privacy|aviso)[^"]*"' home.html | sort -u | head -20
          for path in $(grep -oiE 'href="[^"]*(legal|terms|condicion|conditions)[^"]*"' home.html | sed 's/href="//; s/"$//' | sort -u | head -6); do
            case "$path" in http*) u="$path";; *) u="https://xceed.me$path";; esac
            code=$(curl -sL --max-time 30 -A "$UA" -o t.html -w "%{http_code}" "$u"); echo "== $code $u"
            python3 - <<'PY' || true
          import re,html
          t=open("t.html",encoding="utf-8",errors="ignore").read()
          t=html.unescape(re.sub(r"<script[\s\S]*?</script>|<style[\s\S]*?</style>"," ",t)); t=re.sub(r"<[^>]+>"," ",t); t=re.sub(r"\s+"," ",t)
          hits=0
          for k in ["scrap","robot","crawl","spider","automated","automatiz","data mining","extract","reproduc","copy","API"]:
              for m in re.finditer(k,t,re.I):
                  print("  [%s] …%s" % (k, t[max(0,m.start()-250):m.start()+250])); hits+=1; break
          print("  chars:",len(t),"hits:",hits)
          PY
          done
      - name: Xceed · one event page
        continue-on-error: true
        run: |
          curl -sL --max-time 30 -A "OrivexyNightsBot/1.0" https://xceed.me/es/barcelona/event/humanos-x-nom-pres-mariano-mellino/243900 -o e.html
          python3 - <<'PY'
          import re,json
          h=open("e.html",encoding="utf-8",errors="ignore").read()
          for b in re.findall(r'<script[^>]*application/ld\+json[^>]*>([\s\S]*?)</script>',h):
              try: d=json.loads(b)
              except Exception: continue
              if "Event" in str(d.get("@type","")) if isinstance(d,dict) else False:
                  d.pop("performer",None); print(json.dumps(d,ensure_ascii=False)[:2500])
          PY
