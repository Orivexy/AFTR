name: Data sources probe
# Temporary: checks public sources (format, licence, reachability) from CI.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Xceed · terms and structured events
        continue-on-error: true
        run: |
          UA="OrivexyNightsBot/1.0 (+https://github.com/Orivexy/ORIVEXY-Nights)"
          for u in https://xceed.me/es/terms https://xceed.me/en/terms https://xceed.me/terms-and-conditions https://xceed.me/es/legal/terms; do
            code=$(curl -sL --max-time 30 -A "$UA" -o terms.html -w "%{http_code}" "$u"); echo "== $code $u $(wc -c < terms.html)"
            python3 - <<'PY' || true
          import re,html
          t=open("terms.html",encoding="utf-8",errors="ignore").read()
          t=html.unescape(re.sub(r"<script[\s\S]*?</script>|<style[\s\S]*?</style>"," ",t)); t=re.sub(r"<[^>]+>"," ",t); t=re.sub(r"\s+"," ",t)
          for k in ["scrap","robot","crawl","spider","automated","automatiz","data mining","extract"]:
              for m in re.finditer(k,t,re.I):
                  print("  [%s] …%s" % (k, t[max(0,m.start()-220):m.start()+220])); break
          PY
          done
          for u in https://xceed.me/es/barcelona/events https://xceed.me/es/barcelona/events/all/page-2 https://xceed.me/es/barcelona/club/opium-barcelona https://xceed.me/es/barcelona/clubs; do
            code=$(curl -sL --max-time 30 -A "$UA" -o p.html -w "%{http_code}" "$u")
            echo "== $code $u"
            python3 - <<'PY' || true
          import re,json
          h=open("p.html",encoding="utf-8",errors="ignore").read()
          blocks=re.findall(r'<script[^>]*application/ld\+json[^>]*>([\s\S]*?)</script>',h)
          n=0
          for b in blocks:
              try: d=json.loads(b)
              except Exception: continue
              items=d if isinstance(d,list) else d.get("@graph",[d]) if isinstance(d,dict) else []
              for it in items:
                  if isinstance(it,dict) and "Event" in str(it.get("@type","")):
                      n+=1
                      if n<=2: print(json.dumps(it,ensure_ascii=False)[:1500])
          print("events in JSON-LD:",n, "| links:", len(set(re.findall(r'href="(/es/barcelona/event/[^"]+)"',h))))
          PY
          done
