name: Data sources probe
# Temporary: checks public sources (format, licence, reachability) from CI.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Barcelona · agenda datastore (structure)
        continue-on-error: true
        run: |
          A="https://opendata-ajuntament.barcelona.cat/data/api/action"
          R=877ccf66-9106-4ae2-be51-95a9f6469e4c
          q() { curl -sSG --max-time 90 -A "OrivexyNightsBot/1.0" "$A/datastore_search_sql" --data-urlencode "sql=$1" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',{}).get('records'); print(json.dumps(r if r is not None else d, ensure_ascii=False)[:6000])"; echo; }
          q "SELECT count(*) AS rows, count(distinct register_id) AS events, min(start_date), max(end_date) FROM \"$R\""
          q "SELECT count(distinct register_id) AS upcoming FROM \"$R\" WHERE end_date >= now() OR start_date >= now()"
          q "SELECT secondary_filters_name, count(distinct register_id) n FROM \"$R\" WHERE (end_date >= now() OR start_date >= now()) GROUP BY 1 ORDER BY 2 DESC LIMIT 60"
          q "SELECT values_category, values_attribute_name, count(*) n FROM \"$R\" GROUP BY 1,2 ORDER BY 3 DESC LIMIT 30"
          q "SELECT * FROM \"$R\" WHERE register_id = (SELECT register_id FROM \"$R\" WHERE secondary_filters_name ILIKE '%festa%' AND start_date >= now() LIMIT 1)"
          q "SELECT * FROM \"$R\" WHERE register_id = (SELECT register_id FROM \"$R\" WHERE secondary_filters_name ILIKE '%concert%' AND start_date >= now() LIMIT 1)"
      - name: Barcelona · other nightlife datasets
        continue-on-error: true
        run: |
          A="https://opendata-ajuntament.barcelona.cat/data/api/3/action"
          for q in "discoteques" "oci nocturn" "equipaments culturals" "festes majors" "sales de concerts"; do
            echo "== $q"
            curl -sSG --max-time 60 "$A/package_search" --data-urlencode "q=$q" --data-urlencode "rows=6" | python3 -c "
          import sys,json
          for p in json.load(sys.stdin)['result']['results']:
              print('PKG', p['name'], '|', p.get('title_translated',{}).get('es') or p.get('title'), '|', p.get('frequency'), p.get('license_title'))
              for r in p.get('resources',[]):
                  print('   ', r.get('format'), r.get('id'), r.get('datastore_active'), r.get('name'))"
          done
      - name: Generalitat · Barcelona city value and a sample
        continue-on-error: true
        run: |
          B="https://analisi.transparenciacatalunya.cat/resource/rhpv-yr4f.json"
          curl -sSG --max-time 60 "$B" --data-urlencode '$select=comarca_i_municipi, count(*)' --data-urlencode "\$where=comarca_i_municipi like '%barcelones%'" --data-urlencode '$group=comarca_i_municipi' --data-urlencode '$limit=20' ; echo
          curl -sSG --max-time 60 "$B" --data-urlencode "\$where=comarca_i_municipi like '%barcelones/barcelona' AND data_fi >= '2026-09-30T00:00:00' AND tags_categor_es like '%concerts%'" --data-urlencode '$limit=2' | head -c 5000; echo
          curl -sSG --max-time 60 "$B" --data-urlencode '$select=count(*)' --data-urlencode "\$where=comarca_i_municipi like '%barcelones/barcelona' AND data_fi >= '2026-09-30T00:00:00'" ; echo
      - name: Overpass (retry)
        continue-on-error: true
        run: |
          Q='[out:json][timeout:60];nwr["amenity"="nightclub"](41.30,2.05,41.48,2.25);out count;'
          for e in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.osm.jp/api/interpreter; do
            curl -sS --max-time 90 -A "OrivexyNightsBot/1.0" --data-urlencode "data=$Q" "$e" -o o.txt -w "$e HTTP %{http_code} %{time_total}s\n" || true
            head -c 200 o.txt; echo
          done
