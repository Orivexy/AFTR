name: Data sources probe

# Manual check of the public data sources the app imports (format and
# reachability), printed to the log. Runs on demand and when this file changes.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Madrid · agenda cultural y de ocio (100 días)
        run: |
          curl -sSL --max-time 60 -A "OrivexyNightsBot/1.0" "https://datos.madrid.es/egob/catalogo/206974-0-agenda-eventos-culturales-100.json" -o madrid.json -w "HTTP %{http_code} %{size_download} bytes\n"
          python3 - <<'EOF'
          import json, collections
          d = json.load(open("madrid.json"))
          print("top keys:", list(d.keys()))
          g = d.get("@graph", [])
          print("items:", len(g))
          print(json.dumps(g[:2], ensure_ascii=False, indent=1)[:4000])
          print("types:", collections.Counter(i.get("@type", "") for i in g).most_common(40))
          EOF
      - name: Barcelona · agenda CSV sample
        run: |
          curl -sSL --max-time 120 "https://opendata-ajuntament.barcelona.cat/data/dataset/a25e60cd-3083-4252-9fce-81f733871cb1/resource/877ccf66-9106-4ae2-be51-95a9f6469e4c/download" -o bcn.csv -w "HTTP %{http_code} %{content_type} %{size_download}\n"
          file bcn.csv; head -c 300 bcn.csv | xxd | head -5
          python3 - <<'PY'
          import csv, io, collections
          raw = open("bcn.csv", "rb").read()
          for enc in ("utf-8-sig", "utf-16", "latin-1"):
              try:
                  text = raw.decode(enc); break
              except Exception: pass
          dialect = csv.Sniffer().sniff(text[:5000], delimiters=",;\t")
          rows = list(csv.DictReader(io.StringIO(text), dialect=dialect))
          print("encoding", enc, "delimiter", repr(dialect.delimiter), "rows", len(rows))
          print("columns", list(rows[0].keys()))
          for r in rows[:3]: print(dict(r))
          for col in rows[0].keys():
              if "classif" in col.lower() or "categ" in col.lower() or "tipus" in col.lower():
                  print(col, collections.Counter(r[col] for r in rows).most_common(50))
          PY
      - name: Overpass mirrors
        run: |
          Q='[out:json][timeout:60];nwr["amenity"="nightclub"](41.30,2.05,41.48,2.25);out tags center 2;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $u"
            curl -sS --max-time 90 -A "OrivexyNightsBot/1.0" --data-urlencode "data=$Q" "$u" -o o.json -w "HTTP %{http_code} %{time_total}s %{size_download}\n" || true
            head -c 400 o.json; echo
          done
