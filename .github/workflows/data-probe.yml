name: Data sources probe
# Temporary: checks public sources (format, licence, reachability) from CI.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Satellite tiles (ICGC orthophoto, Barcelona z16)
        continue-on-error: true
        run: |
          # Barcelona centre at z16: x=32919, y=24442 (XYZ)
          for u in "https://geoserveis.icgc.cat/icc_mapesmultibase/noutm/wmts/orto/GRID3857/16/32919/24442.jpeg" \
                   "https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/orto/MON3857NW/16/32919/24442.png" \
                   "https://geoserveis.icgc.cat/icc_mapesmultibase/noutm/wmts/orto/GRID3857/19/263357/195540.jpeg" \
                   "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/24442/32919"; do
            curl -s --max-time 30 -o t.bin -D h.txt -w "%{http_code} %{content_type} %{size_download} $u\n" "$u"
            grep -i "access-control-allow-origin" h.txt || echo "  (no CORS header)"
          done
