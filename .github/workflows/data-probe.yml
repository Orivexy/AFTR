name: Data sources probe

# Manual check of the public data sources the app imports (format and
# reachability), printed to the log. Runs on demand and when this file changes.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/data-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Madrid · agenda cultural y de ocio (100 días)
        run: |
          curl -sSL --max-time 60 -A "OrivexyNightsBot/1.0" "https://datos.madrid.es/egob/catalogo/206974-0-agenda-eventos-culturales-100.json" -o madrid.json -w "HTTP %{http_code} %{size_download} bytes\n"
          python3 - <<'EOF'
          import json, collections
          d = json.load(open("madrid.json"))
          print("top keys:", list(d.keys()))
          g = d.get("@graph", [])
          print("items:", len(g))
          print(json.dumps(g[:2], ensure_ascii=False, indent=1)[:4000])
          print("types:", collections.Counter(i.get("@type", "") for i in g).most_common(40))
          EOF
      - name: Barcelona · catalogue
        run: |
          for u in "https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=agenda-diaria" \
                   "https://opendata-ajuntament.barcelona.cat/data/api/action/package_show?id=agenda-diaria" \
                   "https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_search?q=agenda&rows=5"; do
            echo "== $u"
            curl -sSL --max-time 60 -A "Mozilla/5.0 OrivexyNightsBot/1.0" "$u" -o out.txt -w "HTTP %{http_code} %{content_type} %{size_download}\n"
            head -c 1500 out.txt; echo
            python3 - <<'PY' || true
          import json
          d = json.load(open("out.txt"))["result"]
          pkgs = d.get("results", [d])
          for p in pkgs:
              print("PKG", p.get("name"), p.get("license_title"))
              for r in p.get("resources", []):
                  print("  ", r.get("format"), r.get("name"), r.get("url"), r.get("size"))
          PY
          done
      - name: Overpass reachability and a Barcelona nightlife count
        run: |
          Q='[out:json][timeout:60];nwr["amenity"="nightclub"](41.30,2.05,41.48,2.25);out tags center 3;'
          curl -sS --max-time 90 -A "OrivexyNightsBot/1.0" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -w "\nHTTP %{http_code} %{time_total}s\n" | tail -c 3000
