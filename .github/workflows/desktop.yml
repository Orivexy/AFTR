name: Desktop apps

# Builds ORIVEXY NIGHTS for Windows (.exe), Linux (.AppImage) and macOS (.dmg)
# — Electron + embedded PostgreSQL + schema and base data — and publishes them
# together as one GitHub Release. Pushes to main (and v* tags) become the
# "latest" release, which the download buttons in the README point to.
on:
  push:
    branches: [main, claude/charming-lovelace-al31eg]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nightly
          POSTGRES_PASSWORD: nightly
          POSTGRES_DB: nightly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nightly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nightly:nightly@localhost:5432/orivexy_desktop_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base configuration (migrations + seed, no content)
        run: |
          npx prisma migrate deploy
          ADMIN_EMAIL="" ADMIN_PASSWORD="" npx prisma db seed
          mkdir -p base && npx tsx scripts/export-base-data.mts > base/base-data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: base-data
          path: base/base-data.sql

  windows:
    needs: base-data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NSIS_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - run: bash scripts/build-desktop.sh --platform win --base-data base/base-data.sql
      - name: Fix ownership of files written by Docker
        run: sudo chown -R "$(id -u):$(id -g)" dist-desktop desktop
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist-desktop/ORIVEXY-NIGHTS-Windows.exe

  linux:
    needs: base-data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - run: bash scripts/build-desktop.sh --platform linux --base-data base/base-data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: dist-desktop/ORIVEXY-NIGHTS-Linux.AppImage

  mac:
    needs: base-data
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - run: bash scripts/build-desktop.sh --platform mac --base-data base/base-data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: dist-desktop/ORIVEXY-NIGHTS-Mac.dmg

  release:
    needs: [windows, linux, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: app-*, path: dist, merge-multiple: true }
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v{0}-{1}', steps.v.outputs.version, github.run_number) }}
          name: ORIVEXY NIGHTS ${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ORIVEXY-NIGHTS-Windows.exe
            dist/ORIVEXY-NIGHTS-Linux.AppImage
            dist/ORIVEXY-NIGHTS-Mac.dmg
          body: |
            ## Descargar ORIVEXY NIGHTS

            | Sistema | Archivo |
            | --- | --- |
            | 🪟 **Windows 10/11** (64 bits) | `ORIVEXY-NIGHTS-Windows.exe` |
            | 🐧 **Linux** (x64) | `ORIVEXY-NIGHTS-Linux.AppImage` |
            | 🍎 **macOS** (Apple Silicon, M1 o posterior) | `ORIVEXY-NIGHTS-Mac.dmg` |

            Todo incluido: servidor, base de datos PostgreSQL y ffmpeg. No hace falta instalar nada más.

            **Windows:** abre el `.exe`. SmartScreen (app sin firmar): *Más información* → *Ejecutar de todas formas*.
            **Linux:** `chmod +x ORIVEXY-NIGHTS-Linux.AppImage` y ábrelo (doble clic o `./ORIVEXY-NIGHTS-Linux.AppImage`).
            **Mac:** abre el `.dmg` y arrastra la app a *Aplicaciones*. La primera vez: clic derecho sobre la app → *Abrir* → *Abrir*
            (o *Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente*).

            La primera cuenta que registres es la de administrador. Con Internet, los locales reales se descargan de
            OpenStreetMap al arrancar; no hay datos inventados.

            **Móvil:** con el ordenador y el móvil en la misma Wi‑Fi, menú *ORIVEXY NIGHTS → Abrir en el móvil…* (Ctrl/Cmd+M),
            escanea el QR y añádela a la pantalla de inicio.
