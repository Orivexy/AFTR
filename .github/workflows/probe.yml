name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; OrivexyNights/1.0)"
          curl -sL -A "$UA" https://site.fourvenues.com/robots.txt | head -30
          echo "=== LIST"
          curl -sL -A "$UA" -o l.html -w '%{http_code} %{size_download} %{url_effective}\n' https://site.fourvenues.com/ca/younow/events
          grep -o 'application/ld+json' l.html | wc -l
          grep -o '__NEXT_DATA__\|__NUXT__\|window\.__[A-Z_]*' l.html | sort | uniq -c
          grep -oE 'href="[^"]*"' l.html | sort -u | head -60
          grep -oE '"(https?:)?[^"]*/events/[^"]+"' l.html | sort -u | head -40
          python3 - <<'PY'
          import re
          h=open('l.html').read()
          for m in re.finditer(r'<script[^>]*ld\+json[^>]*>(.*?)</script>', h, re.S): print(m.group(1)[:1500])
          print(re.sub(r'\s+',' ',re.sub(r'<script.*?</script>|<style.*?</style>','',h,flags=re.S))[:3000])
          PY
          E=$(grep -oE 'href="[^"]*/events/[^"#?]+"' l.html | sed 's/href="//;s/"$//' | grep -v '/events$' | head -1)
          case "$E" in http*) ;; *) E="https://site.fourvenues.com$E";; esac
          echo "=== EVENT $E"
          curl -sL -A "$UA" -o e.html -w '%{http_code} %{size_download}\n' "$E"
          python3 - <<'PY'
          import re
          h=open('e.html').read()
          for m in re.finditer(r'<script[^>]*ld\+json[^>]*>(.*?)</script>', h, re.S): print(m.group(1)[:3000])
          print(re.findall(r'<meta[^>]+property="og:[^"]+"[^>]*>', h)[:10])
          print(re.sub(r'\s+',' ',re.sub(r'<script.*?</script>|<style.*?</style>','',h,flags=re.S))[:2000])
          PY
