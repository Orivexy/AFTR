<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>NIVEX</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070b; color: #f4f4f7; font: 14px/1.4 system-ui, sans-serif; -webkit-app-region: drag; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
      .mark { position: relative; width: 26px; height: 26px; border-radius: 50%; background: #d7ff3a; }
      .mark::after { content: ""; position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; border-radius: 50%; background: #07070b; }
      .bar { width: 160px; height: 3px; border-radius: 3px; background: #20202b; overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #d7ff3a; animation: s 1.1s ease-in-out infinite; }
      @keyframes s { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      p { color: #a1a1b3; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><span class="mark"></span>NIVEX</div>
      <div class="bar"></div>
      <p>Arrancando… (la primera vez tarda un poco)</p>
    </div>
  </body>
</html>
